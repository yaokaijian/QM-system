# Cloudflare Pages + D1 配置示例
# 部署后请在 Cloudflare 控制台把实际的 database_id 填入，或使用 Dashboard 绑定

name = "qm-system"
compatibility_date = "2026-11-03"
pages_build_output_dir = "."

# D1 数据库绑定（变量名必须是 DB，与 functions/api/sync.js 中一致）
[[d1_databases]]
binding = "DB"
database_name = "qm-sync"
database_id = "0204173f-a2b6-4412-a609-6244188dd618"
# preview_database_id = "预览环境的 database_id（可选）"
